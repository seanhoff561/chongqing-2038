name: release
# The Windows game (U-104): when main's package.json version has no release yet, the web game is built, wrapped in the
# desktop app (desktop/) and published as that version's GitHub Release with its installer; installed games update
# themselves from it.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" > /dev/null 2>&1; then echo "new=no" >> "$GITHUB_OUTPUT"; else echo "new=yes" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.v.outputs.new == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.v.outputs.new == 'yes'
        run: npm ci
      - if: steps.v.outputs.new == 'yes'
        run: npx vite build
      - if: steps.v.outputs.new == 'yes'
        shell: bash
        run: |
          cp -r dist desktop/web
          cd desktop
          npm version "${{ steps.v.outputs.version }}" --no-git-tag-version --allow-same-version
          npm install
          # (Built here, then published whole by gh: the installer, its blockmap and latest.yml, which installed games
          # read to update themselves.)
          npx electron-builder --win --publish never
          gh release create "v${{ steps.v.outputs.version }}" dist/Chongqing-2038-Setup.exe dist/Chongqing-2038-Setup.exe.blockmap dist/latest.yml --target "$GITHUB_SHA" --title "${{ steps.v.outputs.version }}" --notes "Chongqing 2038 ${{ steps.v.outputs.version }}: run Chongqing-2038-Setup.exe; installed games update themselves."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
